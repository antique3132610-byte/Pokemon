<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    EVFORGE | Order History
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=7"
  >

</head>


<body>

  <nav id="site-nav"></nav>


  <main class="history-page">

    <section class="hero-small">

      <p class="eyebrow">
        ⚡ EVFORGE
      </p>

      <h1>
        📦 Order History
      </h1>

      <p>
        View your previous demo orders,
        totals, coupons and delivery details.
      </p>

    </section>


    <section class="history-actions">

      <a
        class="btn"
        href="shop.html"
      >
        🛒 Continue Shopping
      </a>

      <button
        class="btn secondary"
        onclick="renderOrderHistory()"
      >
        🔄 Refresh
      </button>

      <button
        class="btn danger"
        onclick="clearOrderHistory()"
      >
        🗑️ Clear History
      </button>

    </section>


    <section
      id="history-list"
      class="history-list"
    ></section>

  </main>


  <script
    src="app.js?v=7"
    defer
  ></script>

</body>

</html>
