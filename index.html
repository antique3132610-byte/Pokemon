<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate Pokédex</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #11152b, #080b18);
    color: white;
    min-height: 100vh;
}

/* NAVBAR */

nav {
    height: 88px;
    background: #090b1b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    border-bottom: 1px solid #242844;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    color: #ffd400;
    font-size: 28px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    margin-left: 30px;
}

nav a:hover {
    color: #ffd400;
}

/* HERO */

.hero {
    text-align: center;
    padding: 90px 20px 40px;
    background: radial-gradient(circle at top, #202e61, #101426 65%);
}

.hero h1 {
    font-size: 90px;
    color: #ffd400;
    text-shadow: 0 0 25px rgba(255, 212, 0, 0.25);
    margin-bottom: 25px;
}

.hero p {
    font-size: 23px;
    line-height: 1.5;
    color: #ddd;
    max-width: 700px;
    margin: auto;
}

/* SEARCH */

.search-container {
    text-align: center;
    margin: 55px auto 35px;
}

#search {
    width: min(550px, 85%);
    padding: 20px 25px;
    border-radius: 40px;
    border: none;
    outline: none;
    font-size: 20px;
}

/* FILTERS */

.filters {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 55px;
}

.filter {
    border: none;
    padding: 14px 24px;
    border-radius: 30px;
    background: #303958;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.filter:hover {
    background: #414b72;
}

.filter.active {
    background: #ffd400;
    color: black;
}

/* LOADING */

#loading {
    text-align: center;
    font-size: 22px;
    color: #ffd400;
    margin: 40px;
}

#error {
    text-align: center;
    font-size: 21px;
    color: #ff6b6b;
    margin: 40px;
    display: none;
}

/* POKEMON GRID */

#pokemon-container {
    width: 90%;
    max-width: 1400px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    padding-bottom: 70px;
}

/* CARD */

.card {
    background: linear-gradient(145deg, #202744, #14182d);
    border: 1px solid #30385d;
    border-radius: 25px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    transition: 0.25s;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.35);
}

.card img {
    width: 160px;
    height: 160px;
    object-fit: contain;
}

.card-number {
    color: #9fa8c9;
    font-size: 14px;
    margin-top: 10px;
}

.card h2 {
    font-size: 25px;
    margin: 10px 0;
    text-transform: capitalize;
}

.type {
    display: inline-block;
    background: #ffd400;
    color: black;
    padding: 7px 15px;
    border-radius: 20px;
    font-weight: bold;
    text-transform: capitalize;
}

/* LOAD MORE */

#loadMore {
    display: block;
    margin: 0 auto 70px;
    padding: 16px 35px;
    border: none;
    border-radius: 30px;
    background: #ffd400;
    color: black;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#loadMore:hover {
    background: #ffe44d;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 200;
}

.modal-content {
    background: #171c35;
    width: min(600px, 95%);
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 30px;
    padding: 35px;
    text-align: center;
    position: relative;
}

.close {
    position: absolute;
    right: 25px;
    top: 18px;
    font-size: 35px;
    cursor: pointer;
    color: #aaa;
}

.close:hover {
    color: white;
}

.modal-content img {
    width: 250px;
    max-width: 80%;
}

.modal-content h2 {
    font-size: 38px;
    text-transform: capitalize;
    color: #ffd400;
    margin: 10px;
}

.modal-types {
    margin: 15px;
}

.modal-type {
    display: inline-block;
    background: #303958;
    padding: 8px 15px;
    border-radius: 20px;
    margin: 5px;
    text-transform: capitalize;
}

.info {
    margin: 20px 0;
    color: #ddd;
    font-size: 18px;
}

/* STATS */

.stats {
    margin-top: 25px;
    text-align: left;
}

.stat {
    margin: 15px 0;
}

.stat-name {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
}

.stat-bar {
    height: 10px;
    background: #303958;
    border-radius: 10px;
    overflow: hidden;
}

.stat-fill {
    height: 100%;
    background: #ffd400;
    border-radius: 10px;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 35px;
    background: #090b1b;
    color: #aaa;
}

/* TOP BUTTON */

#topButton {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #ffd400;
    color: black;
    font-size: 22px;
    cursor: pointer;
    display: none;
}

/* MOBILE */

@media (max-width: 600px) {

    nav {
        padding: 0 20px;
    }

    .logo {
        font-size: 20px;
    }

    nav a {
        font-size: 16px;
        margin-left: 10px;
    }

    .hero h1 {
        font-size: 55px;
    }

    .hero p {
        font-size: 18px;
    }

}

</style>
</head>

<body>

<nav>

    <div class="logo">⚡ Ultimate Pokédex</div>

    <div>
        <a href="#">Home</a>
        <a href="#pokedex">Pokédex</a>
    </div>

</nav>


<section class="hero">

    <h1>Pokédex</h1>

    <p>
        Explore Pokémon, discover their abilities,
        and inspect their battle statistics.
    </p>

    <div class="search-container">

        <input
            id="search"
            type="text"
            placeholder="Search Pokémon..."
        >

    </div>

</section>


<div class="filters">

    <button class="filter active" data-type="all">All</button>
    <button class="filter" data-type="fire">🔥 Fire</button>
    <button class="filter" data-type="water">💧 Water</button>
    <button class="filter" data-type="grass">🌱 Grass</button>
    <button class="filter" data-type="electric">⚡ Electric</button>
    <button class="filter" data-type="psychic">🔮 Psychic</button>
    <button class="filter" data-type="dragon">🐉 Dragon</button>

</div>


<div id="loading">
    Loading Pokémon... ⚡
</div>

<div id="error">
    Something went wrong while loading Pokémon.
</div>


<section id="pokedex">

    <div id="pokemon-container"></div>

</section>


<button id="loadMore">
    Load More Pokémon
</button>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">×</span>

        <img id="modal-image">

        <h2 id="modal-name"></h2>

        <div class="modal-types" id="modal-types"></div>

        <div class="info">

            <p id="modal-height"></p>
            <p id="modal-weight"></p>
            <p id="modal-abilities"></p>

        </div>

        <div class="stats">

            <div class="stat">

                <div class="stat-name">
                    <span>HP</span>
                    <span id="hp-value"></span>
                </div>

                <div class="stat-bar">
                    <div class="stat-fill" id="hp-bar"></div>
                </div>

            </div>


            <div class="stat">

                <div class="stat-name">
                    <span>Attack</span>
                    <span id="attack-value"></span>
                </div>

                <div class="stat-bar">
                    <div class="stat-fill" id="attack-bar"></div>
                </div>

            </div>


            <div class="stat">

                <div class="stat-name">
                    <span>Defense</span>
                    <span id="defense-value"></span>
                </div>

                <div class="stat-bar">
                    <div class="stat-fill" id="defense-bar"></div>
                </div>

            </div>


            <div class="stat">

                <div class="stat-name">
                    <span>Speed</span>
                    <span id="speed-value"></span>
                </div>

                <div class="stat-bar">
                    <div class="stat-fill" id="speed-bar"></div>
                </div>

            </div>

        </div>

    </div>

</div>


<button id="topButton" onclick="window.scrollTo({top:0, behavior:'smooth'})">
    ↑
</button>


<footer>

    <p>⚡ Ultimate Pokédex</p>
    <p>Data provided by PokéAPI</p>

</footer>


<script>

const API = "https://pokeapi.co/api/v2/pokemon/";

let allPokemon = [];
let visiblePokemon = [];

let currentPage = 0;
const PAGE_SIZE = 24;

let currentType = "all";


/* LOAD POKEMON */

async function loadPokemon() {

    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    loading.style.display = "block";
    error.style.display = "none";

    try {

        /*
        First get the list.
        This is only ONE API request.
        */

        const response = await fetch(
            "https://pokeapi.co/api/v2/pokemon?limit=151"
        );

        if (!response.ok) {
            throw new Error("Could not contact PokéAPI");
        }

        const data = await response.json();

        /*
        Load details in small groups.
        This prevents 150 requests firing simultaneously.
        */

        const results = data.results;

        for (let i = 0; i < results.length; i += 10) {

            const batch = results.slice(i, i + 10);

            const details = await Promise.all(

                batch.map(async pokemon => {

                    try {

                        const res = await fetch(pokemon.url);

                        if (!res.ok) {
                            return null;
                        }

                        return await res.json();

                    } catch {

                        return null;

                    }

                })

            );

            allPokemon.push(
                ...details.filter(pokemon => pokemon !== null)
            );

            /*
            Show Pokémon while they are loading.
            The page no longer sits there looking dead.
            */

            visiblePokemon = [...allPokemon];

            displayPokemon();

        }

        loading.style.display = "none";

    } catch (err) {

        console.error(err);

        loading.style.display = "none";
        error.style.display = "block";

    }

}


/* DISPLAY */

function displayPokemon() {

    const container =
        document.getElementById("pokemon-container");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let filtered = allPokemon.filter(pokemon => {

        const matchesSearch =
            pokemon.name.toLowerCase().includes(search);

        const matchesType =
            currentType === "all" ||
            pokemon.types.some(
                type => type.type.name === currentType
            );

        return matchesSearch && matchesType;

    });

    visiblePokemon = filtered;

    const amountToShow =
        (currentPage + 1) * PAGE_SIZE;

    const pokemonToShow =
        filtered.slice(0, amountToShow);

    container.innerHTML = "";

    pokemonToShow.forEach(pokemon => {

        const card =
            document.createElement("div");

        card.className = "card";

        const mainType =
            pokemon.types[0].type.name;

        card.innerHTML = `

            <img
                src="${pokemon.sprites.other['official-artwork'].front_default}"
                alt="${pokemon.name}"
                loading="lazy"
            >

            <div class="card-number">
                #${String(pokemon.id).padStart(3, "0")}
            </div>

            <h2>${pokemon.name}</h2>

            <span class="type">
                ${mainType}
            </span>

        `;

        card.onclick = () => showDetails(pokemon);

        container.appendChild(card);

    });


    /* LOAD MORE BUTTON */

    const loadMore =
        document.getElementById("loadMore");

    if (amountToShow >= filtered.length) {

        loadMore.style.display = "none";

    } else {

        loadMore.style.display = "block";

    }

}


/* SEARCH */

document
    .getElementById("search")
    .addEventListener("input", () => {

        currentPage = 0;

        displayPokemon();

    });


/* TYPE FILTER */

document
    .querySelectorAll(".filter")
    .forEach(button => {

        button.addEventListener("click", () => {

            document
                .querySelectorAll(".filter")
                .forEach(btn =>
                    btn.classList.remove("active")
                );

            button.classList.add("active");

            currentType =
                button.dataset.type;

            currentPage = 0;

            displayPokemon();

        });

    });


/* LOAD MORE */

document
    .getElementById("loadMore")
    .addEventListener("click", () => {

        currentPage++;

        displayPokemon();

    });


/* MODAL */

function showDetails(pokemon) {

    const modal =
        document.getElementById("modal");

    document.getElementById("modal-image").src =
        pokemon.sprites.other[
            "official-artwork"
        ].front_default;

    document.getElementById("modal-name").textContent =
        pokemon.name;

    document.getElementById("modal-height").textContent =
        `Height: ${pokemon.height / 10} m`;

    document.getElementById("modal-weight").textContent =
        `Weight: ${pokemon.weight / 10} kg`;

    document.getElementById("modal-abilities").textContent =
        "Abilities: " +
        pokemon.abilities
            .map(a => a.ability.name)
            .join(", ");


    const types =
        document.getElementById("modal-types");

    types.innerHTML = "";

    pokemon.types.forEach(type => {

        const span =
            document.createElement("span");

        span.className = "modal-type";

        span.textContent =
            type.type.name;

        types.appendChild(span);

    });


    /* STATS */

    const stats = {};

    pokemon.stats.forEach(stat => {

        stats[stat.stat.name] =
            stat.base_stat;

    });


    setStat("hp", stats.hp || 0);

    setStat("attack", stats.attack || 0);

    setStat("defense", stats.defense || 0);

    setStat("speed", stats.speed || 0);


    modal.style.display = "flex";

}


function setStat(name, value) {

    document.getElementById(
        name + "-value"
    ).textContent = value;

    document.getElementById(
        name + "-bar"
    ).style.width =
        Math.min(value, 100) + "%";

}


function closeModal() {

    document.getElementById(
        "modal"
    ).style.display = "none";

}


/* CLOSE MODAL WHEN CLICKING OUTSIDE */

document
    .getElementById("modal")
    .addEventListener("click", event => {

        if (
            event.target.id === "modal"
        ) {

            closeModal();

        }

    });


/* ESCAPE KEY */

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

        closeModal();

    }

});


/* TOP BUTTON */

window.addEventListener("scroll", () => {

    const button =
        document.getElementById("topButton");

    if (window.scrollY > 400) {

        button.style.display = "block";

    } else {

        button.style.display = "none";

    }

});


/* START */

loadPokemon();

</script>

</body>
</html>
