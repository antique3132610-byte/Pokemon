<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(0, 0, 0, 0.4);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px 40px;
        }

        .hero h1 {
            font-size: 55px;
            color: #ffd700;
            text-shadow: 4px 4px #333;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 19px;
            color: #ddd;
        }

        .search-area {
            text-align: center;
            margin: 30px auto;
        }

        #search {
            width: 300px;
            max-width: 85%;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            outline: none;
        }

        .pokemon-section {
            padding: 30px 8%;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            width: 220px;
            background: white;
            color: #222;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
        }

        .card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .card h2 {
            margin: 10px 0;
            text-transform: capitalize;
        }

        .type {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            background: #eee;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">⚡ Pokédex</div>

        <div>
            <a href="#">Home</a>
            <a href="#pokemon">Pokémon</a>
        </div>
    </nav>


    <section class="hero">

        <h1>Pokédex</h1>

        <p>
            Search and explore Pokémon!
        </p>

    </section>


    <div class="search-area">

        <input
            type="text"
            id="search"
            placeholder="Search Pokémon..."
            onkeyup="searchPokemon()"
        >

    </div>


    <section class="pokemon-section" id="pokemon">

        <div class="cards">

            <div class="card" data-name="pikachu">

                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png">

                <h2>Pikachu</h2>

                <span class="type">⚡ Electric</span>

            </div>


            <div class="card" data-name="bulbasaur">

                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png">

                <h2>Bulbasaur</h2>

                <span class="type">🌱 Grass</span>

            </div>


            <div class="card" data-name="charmander">

                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png">

                <h2>Charmander</h2>

                <span class="type">🔥 Fire</span>

            </div>


            <div class="card" data-name="squirtle">

                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png">

                <h2>Squirtle</h2>

                <span class="type">💧 Water</span>

            </div>

        </div>

    </section>


    <footer>
        <p>© 2026 My Pokédex</p>
    </footer>


    <script>

        function searchPokemon() {

            let search =
                document.getElementById("search").value.toLowerCase();

            let cards =
                document.querySelectorAll(".card");

            cards.forEach(function(card) {

                let name =
                    card.getAttribute("data-name");

                if (name.includes(search)) {

                    card.style.display = "block";

                } else {

                    card.style.display = "none";

                }

            });

        }

    </script>

</body>
</html>
