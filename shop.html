
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVFORGE | PokéMart</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header id="site-nav"></header>
<main class="wrap section">
  <div class="eyebrow">THE COLLECTOR'S GARAGE</div>
  <h1>POKÉ<span>MART.</span></h1>
  <p>Build your collection, one card at a time.</p>
  <div class="toolbar">
    <input id="search" placeholder="Search cards..." oninput="renderShop()">
    <select id="filter" onchange="renderShop()">
      <option value="all">All cards</option>
      <option value="Rare">Rare</option>
      <option value="Holo">Holo</option>
      <option value="Vintage">Vintage</option>
      <option value="Modern">Modern</option>
      <option value="stock">In stock</option>
      <option value="wishlist">Wishlist</option>
    </select>
  </div>
  <div id="shop-products" class="products"></div>
  <div class="panel section">
    <h2>Your collection, your rules.</h2>
    <p>Want a deal? Check out the discount garage before checkout.</p>
    <a class="btn" href="discounts.html">Find discounts →</a>
    <a class="btn secondary" href="cart.html">View cart →</a>
  </div>
</main>
<footer>EVFORGE PokéMart · Demo storefront</footer>
</body>
</html>
